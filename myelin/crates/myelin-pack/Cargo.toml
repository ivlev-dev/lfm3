[package]
name = "myelin-pack"
description = "GGUF -> int8 HMX crownstone weight packer with quality verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lfm-gguf = { path = "../../../crates/infra-gguf" }
lfm-quant = { path = "../../../crates/infra-quant" }

[[bin]]
name = "myelin-pack"
path = "src/main.rs"
