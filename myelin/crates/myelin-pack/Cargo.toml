[package]
name = "myelin-pack"
description = "GGUF -> DSP/HMX weight formats (int8 crownstone, shortconv blob, KV pages) with quality verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lfm-gguf = { path = "../../../crates/infra-gguf" }
lfm-quant = { path = "../../../crates/infra-quant" }

[dev-dependencies]
lfm-npu-ref = { path = "../../../crates/lfm-npu-ref" }

[[bin]]
name = "myelin-pack"
path = "src/main.rs"
