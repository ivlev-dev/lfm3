[package]
name = "myelin-npu"
description = "NPU transport boundary for Myelin (FastRPC transport and mock executor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
myelin-core.workspace = true
myelin-pack.workspace = true
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lfm-gguf = { path = "../../../crates/infra-gguf" }
half = "2"

[lib]
name = "myelin_npu"
path = "src/lib.rs"

[[bin]]
name = "npu-bench"
path = "src/bin/npu-bench.rs"
