[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
myelin-core = { path = "crates/myelin-core" }
myelin-npu = { path = "crates/myelin-npu" }
myelin-ffi = { path = "crates/myelin-ffi" }
uniffi = "0.29.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
